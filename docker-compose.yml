version: "3.9"

services:
  backend:
    build: ./Backend
    container_name: ai-pdf-backend

    ports:
      - "8000:8000"

    env_file:
      - ./Backend/.env

    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: ai-pdf-frontend

    ports:
      - "5173:5173"

    env_file:
      - ./Frontend/.env

    depends_on:
      - backend

    restart: unless-stopped